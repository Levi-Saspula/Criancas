name: Build educational workbook PDF

on:
  push:
    branches: [main]
    paths:
      - "public/ebook/pequenos-grandes-aprendizes.html"
      - "scripts/generate-ebook-pdf.mjs"
      - ".github/workflows/build-ebook-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate PDF
        run: node scripts/generate-ebook-pdf.mjs
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ebook/pequenos-grandes-aprendizes.pdf
          if git diff --cached --quiet; then
            echo "PDF has not changed."
            exit 0
          fi
          git commit -m "Build printable educational workbook PDF"
          git push
